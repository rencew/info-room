<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Information Forum</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Information Forum</h1>
        <p>Welcome back, student!</p>
    </header>


    <main>

        <section class="login-container">

            <h2>Login</h2>

            <form id="loginForm">

                <!-- Username -->
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >


                <!-- Password -->
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account?
                <a href="signup.html">Sign Up here</a>
            </p>

            <p>
                <a href="index.html">← Back to Home</a>
            </p>

        </section>

    </main>


    <footer>
        <p>Student Information Forum © 2026</p>
    </footer>

  <script src="script.js"></script>

</body>
</html>
