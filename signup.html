<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Student Information Forum</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Information Forum</h1>
        <p>Create your student account</p>
    </header>


    <main>

        <section class="signup-container">

            <h2>Create an Account</h2>

            <form id="signupForm">

                <!-- Full Name -->
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Student ID -->
                <label for="studentID">Student ID Number</label>
                <input
                    type="text"
                    id="studentID"
                    name="studentID"
                    placeholder="Enter your student ID"
                    required
                >


                <!-- Section -->
                <label for="section">Section</label>
                <input
                    type="text"
                    id="section"
                    name="section"
                    placeholder="Example: BSIT 1A"
                    required
                >


                <!-- Email -->
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Username -->
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create a username"
                    required
                >


                <!-- Password -->
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <!-- Confirm Password -->
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    required
                >


                <!-- Certificate of Enrollment -->
                <label for="coe">Certificate of Enrollment</label>

                <p class="form-note">
                    Upload a clear photo of your Certificate of Enrollment
                    for admin verification.
                </p>

                <input
                    type="file"
                    id="coe"
                    name="coe"
                    accept="image/*"
                    required
                >


                <!-- Submit -->
                <button type="submit">
                    Create Account
                </button>

            </form>


            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <p>
                <a href="index.html">← Back to Home</a>
            </p>

        </section>

    </main>


    <footer>
        <p>Student Information Forum © 2026</p>
    </footer>

  <script src="script.js"></script>

</body>
</html>
